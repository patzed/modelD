name: Uppdatera Modell D

on:
  schedule:
    - cron: '30 22 * * *'   # 23:30 svensk vintertid (00:30 sommartid)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: modell-d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Räkna ut modellen
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/build.mjs
      - name: Spara logg och CAPE-kopia i repot
        run: |
          git config user.name "modell-d-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daglig uppdatering $(date -u +%F) [skip ci]"
          git push || true
      - name: Publicera sidan (gh-pages)
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "modell-d-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Sida $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
